<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kviz Opšte Kulture</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a2f9e">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Kviz opšte kulture za 2–8 igrača, sa pozivnicom.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: one centered "studio card" column on a cobalt quiz-show stage; answers as a 2x2 grid of lettered tiles. Single deliberate theme. */
:root{
  --stage:#1a2f9e; --stage-deep:#0f1e6e; --card:#ffffff; --ink:#121a3f; --muted:#5a6390;
  --gold:#ffc83d; --gold-ink:#3a2a00; --line:#dde2f5; --soft:#eef1fb;
  --ok:#1f9d55; --bad:#d6403a; --t1:#2563eb; --t2:#e2483d; --t3:#159a6b; --t4:#d8901a;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--stage) 0%,var(--stage-deep) 100%) fixed,var(--stage-deep);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff}
.logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.logo i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-style:normal;font-size:18px}
.pill{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(5,12,60,.35);display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:26px;font-weight:800}
h2{font-size:19px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
input[type=text]{font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;color:var(--ink);background:#fff;width:100%;box-sizing:border-box}
input[type=text]:focus{outline:none;border-color:var(--t1)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:16px;transition:transform .08s,filter .15s}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-gold{background:var(--gold);color:var(--gold-ink)}
.btn-blue{background:var(--t1);color:#fff}
.btn-ghost{background:var(--soft);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:0 0 auto;padding:9px 14px;font-size:15px;background:var(--soft);color:var(--ink);border:2px solid transparent}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.code{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.invite{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.invite input{flex:1 1 220px;min-width:0;font-size:14px}
.share{display:flex;gap:8px;flex-wrap:wrap}
.share button{flex:1 1 0;min-width:90px;padding:10px 8px;font-size:15px;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px}
.share .sh-vb{background:#7360f2}.share .sh-wa{background:#25d366;color:#08331a}.share .sh-sg{background:#3a76f0}.share .sh-ot{background:var(--soft);color:var(--ink)}
.players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.players li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--soft);font-weight:700}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:18px;line-height:1;flex:0 0 auto}
.avpick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.avpick svg{margin:auto;font-size:28px}
.avpick button{aspect-ratio:1;max-width:100%;padding:0;font-size:24px;line-height:1;background:var(--soft);border:3px solid transparent;border-radius:12px}
.avpick button[aria-pressed=true]{border-color:var(--ink);background:#fff6dc}
.avpick button:disabled{opacity:.25;cursor:not-allowed;filter:grayscale(1)}
.opts.reveal .opt:disabled{opacity:1}
.opt .who i .e{margin-right:3px}
.players .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#fff;color:var(--muted)}
.tag.host{background:var(--gold);color:var(--gold-ink)}
.tag.ok{background:var(--ok);color:#fff}
.score{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:16px}
.note{padding:12px 14px;border-radius:12px;background:#fff6dc;color:#5a4300;font-size:14px}
.note.err{background:#fde8e7;color:#7a1d18}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;font-weight:700}
.qhead .cat{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.timer{height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.timer>div{height:100%;width:100%;background:var(--gold);transform-origin:left;border-radius:99px}
.timer.low>div{background:#ff6b5e}
.clock{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;color:#fff;min-width:3ch;text-align:right}
.qtext{font-family:var(--display);font-size:clamp(19px,4.6vw,24px);font-weight:700;line-height:1.3;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:14px;color:#fff;font-weight:700;font-size:16px;min-height:64px;border:3px solid transparent}
.opt b{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.22);font-family:var(--display);font-size:14px;flex:0 0 auto}
.opt span{min-width:0}
.opt.o0{background:var(--t1)}.opt.o1{background:var(--t2)}.opt.o2{background:var(--t3)}.opt.o3{background:var(--t4)}
.opt.picked{border-color:var(--ink);box-shadow:0 0 0 3px var(--gold) inset}
.opts.locked .opt:not(.picked){filter:saturate(.35) brightness(1.05);opacity:.7}
.opts.reveal .opt{background:var(--soft);color:var(--muted);flex-wrap:wrap}
.opts.reveal .opt b{background:#dfe3f3;color:var(--muted)}
.opts.reveal .opt.right{background:var(--ok);color:#fff;box-shadow:0 0 0 4px #b8ecd0;transform:scale(1.02)}
.opts.reveal .opt.right b,.opts.reveal .opt.wrong b{background:rgba(255,255,255,.25);color:#fff}
.opts.reveal .opt.wrong{background:var(--bad);color:#fff}
.opt .mark{margin-left:auto;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.opt .who{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;padding-left:42px}
.opt .who i{font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.08)}
.opt.right .who i,.opt.wrong .who i{background:rgba(255,255,255,.22)}
.verdict{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;font-weight:700}
.verdict strong{font-family:var(--display);font-size:20px}
.verdict.v-ok{background:#e3f7ec;color:#0f5a32}.verdict.v-bad{background:#fde8e7;color:#7a1d18}.verdict.v-none{background:var(--soft);color:var(--ink)}
.verdict .ans{font-size:15px}
.board{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:22px 32px 1fr auto auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--soft)}
.board li.me{outline:2px solid var(--gold)}
.board .rk{font-family:var(--display);font-size:14px;color:var(--muted);text-align:center}
.board .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .st{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.board .st.done{color:var(--ok)}
.board .score{font-size:20px;min-width:2.5ch;text-align:right}
.status{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--soft);font-weight:700;font-size:13px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#b9c0dc}
.chip.done .dot{background:var(--ok)}
.delta{font-family:var(--display);font-size:14px}
.delta.p{color:var(--ok)}.delta.n{color:var(--bad)}.delta.z{color:var(--muted)}
.big{font-family:var(--display);font-size:44px;font-weight:800;text-align:center}
.podium li:first-child{background:#fff3cc}
.rules{display:flex;gap:8px;flex-wrap:wrap}
.rules span{font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--soft)}
footer{color:rgba(255,255,255,.7);font-size:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
footer a,.linkbtn{color:#fff;font-weight:700;text-decoration:underline;background:none;border:0;padding:0;font-size:12px;cursor:pointer}
.upd{display:flex;flex-direction:column;gap:8px;background:#fff6dc;color:#5a4300;border-radius:14px;padding:14px 16px}
.upd a{align-self:flex-start;text-decoration:none;display:inline-block;border-radius:12px;padding:10px 16px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{box-sizing:border-box}[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="logo"><i>?</i>Kviz</div>
    <span class="pill" id="badge">Opšta kultura</span>
  </header>
  <div class="upd" id="upd" hidden></div>
  <p class="note" id="net" hidden>Veza je prekinuta. Ponovo se povezujem…</p>
  <main id="app"></main>
  <footer><span>Tačan odgovor +3 · netačan −1 · bez odgovora 0</span><span id="appinfo"></span></footer>
</div>

<script src="peerjs.min.js"></script>
<script src="questions.js"></script>
<script>
const PREFIX="kvizsrb-opsta-";


const TIMES=[10,15,20,30,45,60];
const COUNTS=[5,10,15,20,25,30];
const MAX_PLAYERS=8;
const REVEAL_MS=6500;
const AVATARS=["🦊","🐼","🐯","🦁","🐸","🐵","🐨","🐙","🦄","🐲","🦉","🐧","🐢","🦖","🐝","🐬","🦀","🐺","🐮","🐷",'<svg viewBox="0 0 64 64" width="1em" height="1em" style="display:block" aria-label="Dart Vejder"><path d="M32 4C17 4 9 15 9 29v9l-5 16 14 6h28l14-6-5-16v-9C55 15 47 4 32 4z" fill="#111"/><path d="M32 7c-3 0-4 4-4 10v12h8V17c0-6-1-10-4-10z" fill="#3a3a3a"/><path d="M14 30c5-4 11-5 16-2l-2 7c-5-1-10 0-15 3zM50 30c-5-4-11-5-16-2l2 7c5-1 10 0 15 3z" fill="#5b5b5b"/><path d="M27 36h10l5 16H22z" fill="#2b2b2b"/><path d="M28 41h8M27 45h10M26 49h12" stroke="#9a9a9a" stroke-width="1.6"/><path d="M18 54l4-6M46 54l-4-6" stroke="#555" stroke-width="2"/></svg>','<svg viewBox="0 0 64 64" width="1em" height="1em" style="display:block" aria-label="Dart Vejder roze"><path d="M32 4C17 4 9 15 9 29v9l-5 16 14 6h28l14-6-5-16v-9C55 15 47 4 32 4z" fill="#e0428f"/><path d="M32 7c-3 0-4 4-4 10v12h8V17c0-6-1-10-4-10z" fill="#f48cbf"/><path d="M14 30c5-4 11-5 16-2l-2 7c-5-1-10 0-15 3zM50 30c-5-4-11-5-16-2l2 7c5-1 10 0 15 3z" fill="#5a1236"/><path d="M27 36h10l5 16H22z" fill="#b02a6c"/><path d="M28 41h8M27 45h10M26 49h12" stroke="#ffd1e8" stroke-width="1.6"/><path d="M18 54l4-6M46 54l-4-6" stroke="#8f1f57" stroke-width="2"/></svg>',"🐻","🐰"];
const avOk=a=>Number.isInteger(a)&&a>=0&&a<AVATARS.length;
const fmtS=n=>(n<0?"−":"")+Math.abs(n|0);
function avHtml(a,c,fallback){return `<span class="av" style="background:${COLORS[(c||0)%COLORS.length]}">${avOk(a)?AVATARS[a]:esc(initial(fallback))}</span>`}
const COLORS=["#2563eb","#e2483d","#159a6b","#d8901a","#7c3aed","#0e9bb5","#c2417a","#4b5563"];
const LET=["A","B","C","D"];

const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cleanName=n=>Array.from(String(n||"")).filter(ch=>{const c=ch.codePointAt(0);return !(c<32||(c>=127&&c<160)||(c>=0x200b&&c<=0x200f)||(c>=0x2028&&c<=0x202e)||(c>=0x2060&&c<=0x206f))}).join("").trim().slice(0,20);
const mkCode=()=>{const al="abcdefghjkmnpqrstuvwxyz23456789";let s="";for(let i=0;i<5;i++)s+=al[Math.floor(Math.random()*al.length)];return s};
const initial=n=>(n||"?").trim().charAt(0).toUpperCase();
const pts=n=>(n>0?"+":n<0?"−":"")+Math.abs(n);

// ---------- stanje ----------
const S={
  screen:"start", name:cleanName(store.get("kviz.name")), code:"", role:null,
  peer:null, hostConn:null, pmap:{}, roomState:"ok", peers:[], myPeer:"me",
  time:20, count:10, err:"",
  H:null,            // domaćin: pun tok igre
  myAns:[], myRound:-1,   // igrač: moji odgovori
  localKey:"", qStart:0, joinTimer:null, hostSeen:false
};
{const a=parseInt(store.get("kviz.avatar"),10); S.av=avOk(a)?a:Math.floor(Math.random()*20);}
const hashCode=()=>{const m=/^#igra-([a-z0-9]{4,8})$/.exec(location.hash||"");return m?m[1]:""};
S.code=hashCode();

// ---------- veza (PeerJS, direktno između pregledača) ----------
S.roomState = (typeof Peer==="function") ? "ok" : "none";
S.conns={}; // domaćin: peerId -> konekcija
function peerList(){ S.peers=Object.values(S.pmap||{}); }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setNet(on){ S.reconnecting=on; const n=$("#net"); if(n) n.hidden=!on; }

// ---------- pamćenje igre (preživi osvežavanje stranice) ----------
const SAVE_KEY="kviz.save";
function save(){
  if(!S.role||!S.code) return;
  store.set(SAVE_KEY,JSON.stringify({role:S.role,code:S.code,name:S.name,ts:Date.now(),
    H:S.role==="host"?S.H:null,phaseAt:S.hostPhaseAt,myAns:S.myAns,myRound:S.myRound,
    myId:S.myId||null,qKey:S.localKey,qStartAt:S.qStartAt||0,time:S.time,count:S.count}));
}
function loadSave(){ try{const v=JSON.parse(store.get(SAVE_KEY)||"null");return v&&typeof v==="object"?v:null}catch(e){return null} }
function clearSave(){ try{localStorage.removeItem(SAVE_KEY)}catch(e){} }

// ---------- domaćin ----------
function hostOpen(resume){
  return new Promise(res=>{
    let settled=false; const finish=v=>{if(!settled){settled=true;res(v)}};
    const tryOpen=(n)=>{
      const pr=new Peer(PREFIX+S.code,window.PEER_OPTS||{});
      pr.on("open",id=>{S.peer=pr;S.myPeer=id;setNet(false);finish(true)});
      pr.on("error",e=>{
        if(e.type==="unavailable-id"){
          pr.destroy();
          if(resume&&n<15){setTimeout(()=>tryOpen(n+1),2000)}      // stari ID se još oslobađa
          else if(!resume&&n<4){S.code=mkCode();tryOpen(n+1)}
          else {S.err="Ne mogu da otvorim igru. Pokušajte ponovo.";finish(false)}
        }else if(!S.peer){S.err="Ne mogu da otvorim igru ("+e.type+"). Proverite internet i pokušajte ponovo.";finish(false)}
      });
      pr.on("connection",conn=>{
        conn.on("open",()=>{S.conns[conn.peer]=conn; setPresence({role:"host",name:S.name,av:S.av,g:S.H});});
        conn.on("data",d=>{
          if(!d||typeof d!=="object"||d.t!=="p"||typeof d.presence!=="object") return;
          S.pmap=S.pmap||{};
          const old=S.pmap[conn.peer];
          S.pmap[conn.peer]={peer:conn.peer,presence:Object.assign({},old&&old.presence,d.presence)};
          peerList(); hostPublish(); hostTick();
        });
        const gone=()=>{
          if(S.conns[conn.peer]!==conn) return;   // igrač se već ponovo povezao
          delete S.conns[conn.peer]; if(S.pmap){delete S.pmap[conn.peer]; peerList();} hostPublish();
        };
        conn.on("close",gone); conn.on("error",gone);
      });
      pr.on("disconnected",()=>{if(!pr.destroyed){setTimeout(()=>{try{pr.reconnect()}catch(e){}},1500)}});
    };
    tryOpen(0);
  });
}

// ---------- igrač ----------
function guestPeer(){
  // stalni ID igrača, da ga domaćin prepozna posle osvežavanja
  return new Promise(res=>{
    const tryOpen=(n)=>{
      const pr=new Peer(S.myId,window.PEER_OPTS||{});
      pr.on("open",id=>{S.peer=pr;S.myPeer=id;res(true)});
      pr.on("error",e=>{
        if(e.type==="unavailable-id"&&!S.peer){pr.destroy(); if(n<15) setTimeout(()=>tryOpen(n+1),2000); else res(false); return}
        if(e.type==="peer-unavailable"){ S.hostMissing=true; return }
        if(!S.peer) res(false);
      });
      pr.on("disconnected",()=>{if(!pr.destroyed){setTimeout(()=>{try{pr.reconnect()}catch(e){}},1500)}});
    };
    tryOpen(0);
  });
}
function connectHost(){
  return new Promise(res=>{
    S.hostMissing=false;
    const conn=S.peer.connect(PREFIX+S.code,{reliable:true});
    let done=false;
    conn.on("open",()=>{
      done=true; S.hostConn=conn; setNet(false);
      setPresence({role:"player",name:S.name,av:S.av,r:S.myRound,a:S.myAns});
      res(true);
    });
    conn.on("data",d=>{
      if(!d||typeof d!=="object"||d.t!=="p"||typeof d.presence!=="object") return;
      S.pmap={[conn.peer]:{peer:conn.peer,presence:d.presence}}; peerList(); onRoomChange();
    });
    conn.on("close",()=>{ if(S.hostConn===conn){ S.hostConn=null; reconnectLoop(); } });
    const t0=Date.now();
    const iv=setInterval(()=>{
      if(done){clearInterval(iv);return}
      if(S.hostMissing||Date.now()-t0>8000){clearInterval(iv);try{conn.close()}catch(e){};res(false)}
    },250);
  });
}
async function reconnectLoop(){
  if(S.reconnecting||S.role!=="player") return;
  setNet(true);
  const until=Date.now()+120000;
  while(S.role==="player"&&Date.now()<until){
    if(S.peer&&!S.peer.destroyed&&!S.peer.disconnected&&await connectHost()) return;
    await sleep(3000);
  }
  if(S.role==="player"){ setNet(false); S.screen="gone"; render(); }
}
async function guestJoin(code){
  if(!S.myId){ S.myId=PREFIX+code+"-"+Math.random().toString(36).slice(2,9); }
  if(!await guestPeer()){ S.err="Ne mogu da se povežem. Proverite internet i pokušajte ponovo."; return false; }
  save();
  if(await connectHost()) return true;
  if(S.hostMissing&&!S.resuming){ S.screen="gone"; S.hostSeen=false; return true; }
  reconnectLoop(); return true;
}
function setPresence(obj){
  try{
    if(S.role==="host"){ for(const c of Object.values(S.conns)) if(c.open) c.send({t:"p",presence:obj}); }
    else if(S.hostConn&&S.hostConn.open){ S.hostConn.send({t:"p",presence:obj}); }
  }catch(e){}
}

// ---------- pomoćne ----------
function hostPeer(){ return S.peers.find(p=>p.presence&&p.presence.role==="host"&&!p.sameTab) }
function G(){ // trenutno stanje igre koje vidim
  if(S.role==="host") return S.H;
  const h=hostPeer(); const g=h&&h.presence.g;
  return (g&&typeof g==="object")?g:null;
}
function lobbyPlayers(){
  if(S.role==="player"){
    const g=G();
    if(g&&Array.isArray(g.lobby)&&g.lobby.length){
      const l=g.lobby.map(x=>({peer:x.p,name:cleanName(x.n),av:x.a,host:!!x.h,me:x.p===S.myPeer}));
      if(!l.some(x=>x.me)) l.push({peer:S.myPeer,name:S.name,av:S.av,host:false,me:true});
      return l.sort((a,b)=>(b.host-a.host));
    }
  }
  const list=[{peer:S.myPeer,name:S.name,av:S.av,host:S.role==="host",me:true}];
  if(S.role==="host"){
    // samo domaćin vidi ko je u sobi kao igrač
  }
  for(const p of S.peers){
    if(p.sameTab) continue;
    const pr=p.presence||{}; const n=cleanName(pr.name);
    if(!n||(pr.role!=="player"&&pr.role!=="host")) continue;
    list.push({peer:p.peer,name:n,av:avOk(pr.av)?pr.av:null,host:pr.role==="host",me:false});
  }
  list.sort((a,b)=>(b.host-a.host));
  if(S.role==="host") uniqueAvatars(list);
  return list;
}
// Svaki igrač ima svoj avatar: ko je prvi izabrao zadržava ga, ostali dobijaju prvi slobodan.
function uniqueAvatars(list){
  const used=new Set();
  for(const p of list){
    p.want=p.av;
    if(avOk(p.av)&&!used.has(p.av)){used.add(p.av);continue}
    let f=0; while(f<AVATARS.length&&used.has(f)) f++;
    p.av=f<AVATARS.length?f:null; if(p.av!==null) used.add(f);
  }
  return list;
}
function playerPresence(){ setPresence({role:"player",name:S.name,av:S.av,r:S.myRound,a:S.myAns}) }
function answerOf(peer,g){
  if(peer===S.myPeer) return S.role==="host"?S.myAns[g.qi]:null;
  const p=S.peers.find(x=>x.peer===peer); if(!p) return undefined;
  const pr=p.presence||{}; if(pr.r!==g.round||!Array.isArray(pr.a)) return null;
  const v=pr.a[g.qi]; if(!Array.isArray(v)) return null;
  const c=v[0]; return (Number.isInteger(c)&&c>=0&&c<4)?v:null;
}
const inRoster=g=>Array.isArray(g.roster)&&g.roster.some(r=>r.p===S.myPeer);
const myRow=g=>Array.isArray(g.roster)?g.roster.find(r=>r.p===S.myPeer):null;
const present=peer=>peer===S.myPeer||S.peers.some(p=>p.peer===peer);

// ---------- domaćin: tok igre ----------
function hostPublish(){
  if(!S.H) return;
  S.H.lobby = S.H.phase==="lobby" ? lobbyPlayers().map(p=>({p:p.peer,n:p.name,a:p.av,w:p.want,h:p.host})) : [];
  S.H.done = S.H.phase==="q" ? S.H.roster.filter(r=>answerOf(r.p,S.H)).map(r=>r.p) : [];
  setPresence({role:"host",name:S.name,av:S.av,g:S.H}); onRoomChange(); save();
}
function hostCreate(){
  S.role="host"; S.code=mkCode();
  S.H={round:0,phase:"lobby",time:S.time,count:S.count,qi:0,qs:[],roster:[]};
  try{ history.replaceState(null,"","#igra-"+S.code) }catch(e){}
}
// ---------- pitanja bez ponavljanja (pamti domaćinov pregledač) ----------
const qid=q=>{let h=5381;const t=q[1];for(let i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return h.toString(36)};
function usedSet(){try{const v=JSON.parse(store.get("kviz.used")||"[]");return new Set(Array.isArray(v)?v:[])}catch(e){return new Set()}}
function unusedCount(){const u=usedSet();return BANK.filter(q=>!u.has(qid(q))).length}
function pickQuestions(n){
  let used=usedSet();
  let picks=shuffle(BANK.map((_,i)=>i).filter(i=>!used.has(qid(BANK[i])))).slice(0,n);
  if(picks.length<n){ // sva pitanja su iskorišćena: počinje novi krug
    const have=new Set(picks);
    used=new Set();
    picks=picks.concat(shuffle(BANK.map((_,i)=>i).filter(i=>!have.has(i))).slice(0,n-picks.length));
  }
  picks.forEach(i=>used.add(qid(BANK[i])));
  store.set("kviz.used",JSON.stringify([...used]));
  return picks;
}
function hostStart(){
  const players=lobbyPlayers().slice(0,MAX_PLAYERS);
  const roster=players.map((p,i)=>({p:p.peer,n:p.name,a:avOk(p.av)?p.av:null,s:0,c:i,lc:-1,lp:0}));
  const picks=pickQuestions(Math.min(S.count,BANK.length));
  S.H={round:(S.H?S.H.round:0)+1,phase:"q",time:S.time,count:picks.length,qi:0,
       qs:picks.map(i=>[i,...shuffle([0,1,2,3])]),roster};
  S.myAns=[]; S.hostPhaseAt=Date.now();
  hostPublish();
}
function hostTick(){
  const H=S.H; if(!H||S.role!=="host") return;
  const now=Date.now();
  if(H.phase==="q"){
    const ids=H.roster.map(r=>r.p).filter(present);
    const all=ids.length>0&&ids.every(id=>answerOf(id,H));
    if(all||now-S.hostPhaseAt>H.time*1000+800){
      const perm=H.qs[H.qi].slice(1), right=perm.indexOf(0);
      for(const r of H.roster){
        const a=answerOf(r.p,H);
        if(!a){r.lc=-1;r.lp=0}else{r.lc=a[0];r.lp=a[0]===right?3:-1}
        r.s+=r.lp;
      }
      H.phase="reveal"; S.hostPhaseAt=now; hostPublish();
    }
  }else if(H.phase==="reveal"){
    if(now-S.hostPhaseAt>REVEAL_MS){
      if(H.qi+1<H.count){H.qi++;H.phase="q"}else{H.phase="end"}
      S.hostPhaseAt=now; hostPublish();
    }
  }
}
setInterval(hostTick,200);
function hostToLobby(){ S.H.phase="lobby"; S.H.roster=[]; S.myAns=[]; hostPublish(); }

// ---------- igrač ----------
function answer(displayIdx){
  const g=G(); if(!g||g.phase!=="q") return;
  if(S.myAns[g.qi]) return;
  const el=performance.now()-S.qStart;
  if(el>g.time*1000) return;
  if(!inRoster(g)) return;
  S.myAns[g.qi]=[displayIdx,Math.round(el)]; save();
  if(S.role!=="host") setPresence({role:"player",name:S.name,av:S.av,r:g.round,a:S.myAns});
  if(S.role==="host"){ hostPublish(); hostTick(); }
  render(true);
}

// ---------- reakcija na promene ----------
function onRoomChange(){
  if(S.role==="player"){
    const h=hostPeer();
    if(h){S.hostSeen=true; clearTimeout(S.joinTimer)}
    const g=G();
    if(g&&g.round!==S.myRound){S.myRound=g.round;S.myAns=[];setPresence({role:"player",name:S.name,av:S.av,r:g.round,a:[]});save()}
    if(g&&g.phase==="lobby"&&Array.isArray(g.lobby)){
      const me=g.lobby.find(x=>x.p===S.myPeer);
      if(me&&me.w===S.av&&avOk(me.a)&&me.a!==S.av){S.av=me.a;S.avMoved=true;playerPresence();save()}
    }
    if(g){S.screen=g.phase==="lobby"?"lobby":"game"}
  }else if(S.role==="host"){
    S.screen=S.H.phase==="lobby"?"lobby":"game";
  }
  const g=G();
  if(g&&g.phase==="q"){
    const k=g.round+":"+g.qi;
    if(S.localKey!==k){S.localKey=k;S.qStart=performance.now();S.qStartAt=Date.now();save()}
  }
  render(true);
}

// ---------- prikaz ----------
let lastKey="";
function screenKey(){
  const g=G();
  if(S.screen==="game"&&g) return "game:"+g.round+":"+g.qi+":"+g.phase+":"+(S.myAns[g.qi]?1:0);
  return S.screen+":"+S.roomState+":"+S.err;
}
function render(soft){
  const k=screenKey();
  if(soft&&k===lastKey){ updateDynamic(); return; }
  lastKey=k;
  $("#badge").textContent = S.code&&S.screen!=="start" ? "Igra "+S.code.toUpperCase() : "Opšta kultura";
  ({start:vStart,lobby:vLobby,game:vGame,gone:vGone})[S.screen]();
  updateDynamic();
}

const SHARE_PKG={viber:"com.viber.voip",whatsapp:"com.whatsapp",signal:"org.thoughtcrime.securesms",other:""};
function shareInvite(appName,url){
  const text=`Hajde da igramo kviz! Uđi preko linka: ${url} (kod igre: ${S.code.toUpperCase()})`;
  const msg=t=>{const m=$("#shareMsg");if(m){m.textContent=t;m.hidden=false}};
  if(window.KvizApp&&KvizApp.share){KvizApp.share(text,SHARE_PKG[appName]);return}
  if(appName==="whatsapp"){window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");return}
  if(appName==="viber"){location.href="viber://forward?text="+encodeURIComponent(text);return}
  // Signal nema link za deljenje: telefon nudi meni za deljenje, inače kopiramo poruku.
  if(navigator.share){navigator.share({text}).catch(()=>{});return}
  const copied=()=>msg(appName==="signal"?"Poruka je kopirana. Otvorite Signal i nalepite je u razgovor.":"Poruka je kopirana, nalepite je gde želite.");
  try{navigator.clipboard.writeText(text).then(copied,()=>msg("Kopirajte link iznad i pošaljite ga."))}catch(e){msg("Kopirajte link iznad i pošaljite ga.")}
}

  $("#opts").onclick=e=>{const b=e.target.closest(".opt");if(b&&!b.disabled)answer(+b.dataset.i)};
}
function verdictBox(r,right,text,inGame){
  const ans=`<span class="ans">Tačan odgovor: <b>${LET[right]} · ${esc(text)}</b></span>`;
  if(!inGame||!r) return `<div class="verdict v-none"><strong>Tačan odgovor</strong>${ans}</div>`;
  if(r.lc===-1) return `<div class="verdict v-none"><strong>Bez odgovora · 0</strong>${ans}</div>`;
  return r.lc===right?`<div class="verdict v-ok"><strong>Tačno! +3</strong>${ans}</div>`:`<div class="verdict v-bad"><strong>Netačno · −1</strong>${ans}</div>`;
}
function rosterSorted(g){
  return (g.roster||[]).slice().sort((a,b)=>b.s-a.s||a.c-b.c);
}
function updateGame(){
  const g=G(); const st=$("#gstat"); if(!g||!st) return;
  const reveal=g.phase==="reveal";
  const rows=rosterSorted(g);
  let rank=0,prev=null;
  st.innerHTML=rows.map((r,i)=>{
    if(r.s!==prev){rank=i+1;prev=r.s}
    const name=esc(cleanName(r.n))+(r.p===S.myPeer?" (vi)":"");
    let stat;
    if(reveal){const cls=r.lp>0?"p":r.lp<0?"n":"z";stat=`<span class="delta ${cls}">${pts(r.lp|0)}</span>`}
    else{const done=r.p===S.myPeer?!!S.myAns[g.qi]:S.role==="host"?!!answerOf(r.p,g):(Array.isArray(g.done)&&g.done.includes(r.p));
      stat=`<span class="st ${done?"done":""}">${done?"✓ odgovorio":"razmišlja…"}</span>`}
    return `<li class="${r.p===S.myPeer?"me":""}"><span class="rk">${rank}.</span>${avHtml(r.a,r.c,r.n)}<span class="nm">${name}</span>${stat}<span class="score">${fmtS(r.s)}</span></li>`;
  }).join("");
}
function vEnd(g){
  const rows=rosterSorted(g);
  const top=rows[0]; const tie=rows.length>1&&rows[1].s===top.s;
  app.innerHTML=`<section class="card">
    <div style="display:flex;flex-direction:column;gap:6px;text-align:center">
      <p class="muted small" style="text-transform:uppercase;letter-spacing:.1em;font-weight:800">Kraj kviza</p>
      <h1>${top?(tie?"Nerešeno!":"Pobednik: "+esc(cleanName(top.n))):"Kraj"}</h1>
      ${top?`<div class="big">${fmtS(top.s)} <span class="muted" style="font-size:18px">poena</span></div>`:""}
    </div>
    <ol class="players podium">${rows.map((r,i)=>`<li><span class="score" style="min-width:2ch">${i+1}.</span>${avHtml(r.a,r.c,r.n)}<span class="nm">${esc(cleanName(r.n))}${r.p===S.myPeer?" (vi)":""}</span><span class="score">${fmtS(r.s)}</span></li>`).join("")}</ol>
    ${S.role==="host"?`<button class="btn-gold" id="again">Nova igra sa istim igračima</button>`:`<p class="muted small" style="text-align:center">Domaćin može da pokrene novu igru.</p>`}
  </section>`;
  const a=$("#again"); if(a)a.onclick=hostToLobby;
}
function vGone(){
  app.innerHTML=`<section class="card">
    <h2>${S.hostSeen?"Domaćin je napustio igru":"Igra nije pronađena"}</h2>
    <p class="muted">${S.hostSeen?"Igra je prekinuta. Možete napraviti novu.":"Proverite kod ili zamolite domaćina da ostavi kviz otvoren pa pokušajte ponovo."}</p>
    <button class="btn-gold" id="back">Na početak</button>
  </section>`;
  $("#back").onclick=()=>{clearSave();setNet(false);try{S.peer&&S.peer.destroy()}catch(e){};S.peer=null;S.hostConn=null;S.conns={};S.pmap={};S.role=null;S.hostSeen=false;S.peers=[];S.code="";S.screen="start";try{history.replaceState(null,"",location.pathname+location.search)}catch(e){};render()};
}
function updateDynamic(){
  if(S.screen==="lobby") updateLobby();
  if(S.screen==="game") updateGame();
}

// tajmer
(function loop(){
  const g=G();
  if(S.screen==="game"&&g&&g.phase==="q"){
    const left=Math.max(0,g.time*1000-(performance.now()-S.qStart));
    const f=$("#tfill"),c=$("#clock"),b=$("#tbar");
    if(f)f.style.transform=`scaleX(${left/(g.time*1000)})`;
    if(c)c.textContent=Math.ceil(left/1000);
    if(b)b.classList.toggle("low",left<5000);
    if(left<=0&&!S.myAns[g.qi]){const o=$("#opts");if(o&&!o.classList.contains("locked")){o.classList.add("locked");o.querySelectorAll(".opt").forEach(x=>x.disabled=true);const m=$("#gmsg");if(m)m.textContent="Vreme je isteklo."}}
  }
  requestAnimationFrame(loop);
})();

// ---------- Android aplikacija: verzija i ažuriranje ----------
(function appInfo(){
  const m=/KvizAndroid\/(\d+)\/([0-9A-Za-z.]+)/.exec(navigator.userAgent||"");
  const el=$("#appinfo"), ban=$("#upd");
  async function check(manual){
    const st=$("#chkst"); if(st&&manual) st.textContent=" · Proveravam…";
    try{
      const v=await (await fetch("version.json?t="+Date.now(),{cache:"no-store"})).json();
      if(+v.versionCode>+m[1]){
        ban.innerHTML=`<b>Dostupna je nova verzija aplikacije: ${esc(v.versionName)} (vi imate ${esc(m[2])})</b>${v.notes?`<span>${esc(v.notes)}</span>`:""}<a class="btn-gold" href="${esc(v.url)}">Preuzmi i instaliraj</a><span class="small">Posle preuzimanja otvorite fajl kviz.apk i potvrdite instalaciju. Vaši podaci ostaju.</span>`;
        ban.hidden=false; if(st) st.textContent=" · Ima nova verzija";
      }else if(st) st.textContent=manual?" · Imate najnoviju verziju":"";
    }catch(e){ if(st&&manual) st.textContent=" · Provera nije uspela, proverite internet"; }
  }
  if(m){
    el.innerHTML=`Android aplikacija v${esc(m[2])} · <button class="linkbtn" id="chk" type="button">Proveri ažuriranje</button><span id="chkst"></span>`;
    $("#chk").onclick=()=>check(true);
    check(false);
  }else{
    el.innerHTML=`<a href="https://github.com/dartvejder/kviz/releases/latest/download/kviz.apk">Preuzmi Android aplikaciju (APK)</a>`;
  }
})();

// ---------- nastavak posle osvežavanja ----------
(async function resume(){
  const v=loadSave();
  if(!v||!v.code||v.code!==hashCode()||Date.now()-(v.ts||0)>3*3600*1000||S.roomState!=="ok"){ render(); return; }
  S.name=cleanName(v.name)||S.name; S.code=v.code; S.time=v.time||S.time; S.count=v.count||S.count;
  S.myAns=Array.isArray(v.myAns)?v.myAns:[]; S.myRound=typeof v.myRound==="number"?v.myRound:-1;
  if(v.qKey){ S.localKey=v.qKey; S.qStartAt=v.qStartAt||Date.now(); S.qStart=performance.now()-(Date.now()-S.qStartAt); }
  S.resuming=true;
  if(v.role==="host"&&v.H){
    S.role="host"; S.H=v.H; S.hostPhaseAt=v.phaseAt||Date.now();
    app.innerHTML='<section class="card"><p>Vraćam igru…</p></section>';
    if(!await hostOpen(true)){ S.role=null; S.H=null; render(); return; }
    S.screen=S.H.phase==="lobby"?"lobby":"game"; hostPublish(); render();
  }else if(v.role==="player"){
    S.role="player"; S.myId=v.myId||null;
    app.innerHTML='<section class="card"><p>Vraćam se u igru…</p></section>';
    if(!await guestJoin(S.code)){ S.role=null; render(); return; }
    if(S.screen==="start") S.screen="lobby";
    render();
  }else render();
  S.resuming=false;
})();
</script>
