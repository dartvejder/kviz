<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kviz opšte kulture</title>
<meta name="theme-color" content="#1a2f9e">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Kviz opšte kulture je sada aplikacija za Android i iPhone.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 20%, #2a46c9 0%, #0f1e6e 70%); color: #fff;
  }
  main {
    width: 100%; max-width: 420px; text-align: center; padding: 32px 24px; border-radius: 20px;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
  }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 1.6rem; margin: 16px 0 8px; }
  p { line-height: 1.5; color: #dfe5ff; margin: 8px 0; }
  .male { font-size: 0.85rem; margin-top: 24px; }
  a { color: #ffd84d; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-512.png" alt="">
  <h1>Kviz opšte kulture</h1>
  <p>Igra u pregledaču je ugašena.</p>
  <p>Kviz je sada aplikacija za Android i iPhone. Ako si dobio pozivnicu, otvori je u aplikaciji.</p>
  <p class="male"><a href="privacy.html">Politika privatnosti</a></p>
</main>
<script>
  // Stari service worker (obaveštenja iz web igre) više nije potreban.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  }
</script>
</body>
</html>
