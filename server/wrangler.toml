# Kviz server: Worker + jedan Durable Object po sobi + D1 baza.
name = "kviz-server"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# kviz.dartchat.trade/api/* i /ws/* idu na Worker; ostalo služi Pages.
routes = [
  { pattern = "kviz.dartchat.trade/api/*", zone_name = "dartchat.trade" },
  { pattern = "kviz.dartchat.trade/ws/*", zone_name = "dartchat.trade" }
]

[[durable_objects.bindings]]
name = "SOBA"
class_name = "Soba"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Soba"]

[[d1_databases]]
binding = "DB"
database_name = "kviz"
# Upisuje se posle "wrangler d1 create kviz".
database_id = "00000000-0000-0000-0000-000000000000"
