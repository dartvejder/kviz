name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "version.json", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Nedostaje tajna ANDROID_KEYSTORE (vidi README, deo Android)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kviz.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/kviz.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Read version
        id: ver
        run: |
          echo "name=$(jq -r .versionName version.json)" >> "$GITHUB_OUTPUT"
          echo "notes=$(jq -r .notes version.json)" >> "$GITHUB_OUTPUT"
      - name: Prepare file
        run: cp android/app/build/outputs/apk/release/app-release.apk kviz.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.ver.outputs.name }}
          name: Kviz ${{ steps.ver.outputs.name }}
          body: ${{ steps.ver.outputs.notes }}
          files: kviz.apk
          make_latest: true
