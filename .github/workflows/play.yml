name: Google Play

# Pravi potpisan paket (.aab) Flutter aplikacije (app/) za Google Play,
# isto kao u Dart Chatu.
# Na pull requestu samo proverava da se Play verzija prevodi (bez potpisa).
# Na main grani (ili ručno iz kartice Actions) pravi potpisan kviz-play.aab
# koji Claude preko Chrome-a postavi u Play Console. Sve radi na PC runneru
# (barcodeDesktop), koji mora biti upaljen i prijavljen; run čeka dok ne bude.
on:
  pull_request:
    paths: ["app/**", ".github/workflows/play.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/play.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Play verzija se prevodi
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Windows, dartchat-pc]
    timeout-minutes: 30
    defaults:
      run:
        # Git bash punom putanjom: obični "bash" na Windowsu je WSL.
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Flutter sa PC-ja
        run: echo 'C:\flutter\bin' >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Build (bez potpisa)
        run: flutter build appbundle --release --build-number=2000

  bundle:
    name: Potpisan paket za Google Play
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, dartchat-pc]
    timeout-minutes: 30
    defaults:
      run:
        # Git bash punom putanjom: obični "bash" na Windowsu je WSL.
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
        working-directory: app
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Provera ključa
        id: key
        working-directory: .
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tajne ANDROID_KEYSTORE i ANDROID_KEYSTORE_PASSWORD nisu podešene, pa paket nije napravljen (vidi README, deo Google Play)."
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - name: Flutter sa PC-ja
        if: steps.key.outputs.present == 'true'
        run: echo 'C:\flutter\bin' >> "$GITHUB_PATH"
      - name: Vrati ključ
        if: steps.key.outputs.present == 'true'
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kviz.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/kviz.keystore" >> "$GITHUB_ENV"
      - run: flutter pub get
        if: steps.key.outputs.present == 'true'
      # Google Play traži veći broj verzije za svako slanje. Broj pokretanja
      # ovog workflowa uvek raste; 2000+ ga drži iznad starih WebView verzija (1000+).
      - name: Build paketa
        if: steps.key.outputs.present == 'true'
        run: flutter build appbundle --release --build-number=$((2000 + ${{ github.run_number }}))
      - name: Ukloni ključ
        if: always() && steps.key.outputs.present == 'true'
        working-directory: .
        run: rm -f "$RUNNER_TEMP/kviz.keystore"
      - name: Pripremi fajl
        if: steps.key.outputs.present == 'true'
        run: cp build/app/outputs/bundle/release/app-release.aab ../kviz-play.aab
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: kviz-play-bundle
          path: kviz-play.aab
          retention-days: 1
