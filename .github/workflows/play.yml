name: Google Play

# Pravi potpisan paket (.aab) za Google Play, isto kao u Dart Chatu.
# Na pull requestu samo proverava da se Play verzija prevodi (bez potpisa).
# Na main grani (ili ručno iz kartice Actions) pravi potpisan kviz-play.aab
# koji Claude preko Chrome-a postavi u Play Console. Sve radi na PC runneru
# (barcodeDesktop), koji mora biti upaljen i prijavljen; run čeka dok ne bude.
on:
  pull_request:
    paths: ["android/**", "version.json", ".github/workflows/play.yml"]
  push:
    branches: [main]
    paths: ["android/**", "version.json", ".github/workflows/play.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Play verzija se prevodi
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Windows, dartchat-pc]
    timeout-minutes: 30
    defaults:
      run:
        # Git bash punom putanjom: obični "bash" na Windowsu je WSL.
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build (bez potpisa)
        working-directory: android
        run: gradle bundleRelease -Pplay -PplayVersionCode=1000 --no-daemon

  bundle:
    name: Potpisan paket za Google Play
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, dartchat-pc]
    timeout-minutes: 30
    defaults:
      run:
        # Git bash punom putanjom: obični "bash" na Windowsu je WSL.
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Provera ključa
        id: key
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tajne ANDROID_KEYSTORE i ANDROID_KEYSTORE_PASSWORD nisu podešene, pa paket nije napravljen (vidi README, deo Google Play)."
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.present == 'true'
        with:
          gradle-version: "8.14.3"
      - name: Vrati ključ
        if: steps.key.outputs.present == 'true'
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kviz.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/kviz.keystore" >> "$GITHUB_ENV"
      # Google Play traži veći broj verzije za svako slanje. Broj pokretanja
      # ovog workflowa uvek raste; 1000+ ga drži iznad brojeva APK verzija.
      - name: Build paketa
        if: steps.key.outputs.present == 'true'
        working-directory: android
        run: gradle bundleRelease -Pplay -PplayVersionCode=$((1000 + ${{ github.run_number }})) --no-daemon
      - name: Ukloni ključ
        if: always() && steps.key.outputs.present == 'true'
        run: rm -f "$RUNNER_TEMP/kviz.keystore"
      - name: Pripremi fajl
        if: steps.key.outputs.present == 'true'
        run: cp android/app/build/outputs/bundle/release/app-release.aab kviz-play.aab
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: kviz-play-bundle
          path: kviz-play.aab
          retention-days: 1
